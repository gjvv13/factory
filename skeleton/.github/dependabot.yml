# Dependabot version-updates — door `factory sync` onderhouden.
#
# Prerequisite: zet "Dependabot security updates" aan in de repo-instellingen
# (Settings → Code security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      patch-en-minor:
        update-types:
          - minor
          - patch
    # De factory-dep is een git-tag, geen npm-versie; Dependabot kan hem niet
    # bumpen en produceert dagelijks een rode version-update-run (#617).
    ignore:
      - dependency-name: '@gjvv13/factory'
      - dependency-name: factory
    open-pull-requests-limit: 5

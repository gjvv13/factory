# Dependabot version-updates — door `factory sync` onderhouden.
#
# Prerequisite: zet "Dependabot security updates" aan in de repo-instellingen
# (Settings → Code security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      patch-en-minor:
        update-types:
          - minor
          - patch
    # De factory-dep (`@gjvv13/factory`) wordt bewust NIET meer genegeerd (#743): sinds
    # factory publiek op de registry staat (#714) bumpt Dependabot hem gewoon, en
    # `sync-on-factory-bump.yml` heelt die PR zodat de gesyncte bestanden meekomen. Dat
    # verving de zelfgebouwde `bump-factory.yml` (geretireerd).
    open-pull-requests-limit: 5

# Dependabot version-updates voor factory-applicaties.
# Dit bestand wordt door `factory sync` naar .github/dependabot.yml gekopieerd.
#
# Prerequisite per repo: zet "Dependabot security updates" aan in de
# GitHub-repo-instellingen (Settings → Code security → Dependabot security
# updates). Security-updates staan los van version-updates en vereisen die
# instelling eenmalig.
#
# Alleen npm, niet github-actions: app-workflows worden via `factory sync`
# beheerd. Een actions-bump in een app zou bij de volgende sync overschreven
# worden.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      patch-en-minor:
        update-types:
          - minor
          - patch
    # De factory-dep (`@gjvv13/factory`) wordt bewust NIET meer genegeerd (#743): sinds
    # factory publiek op de registry staat (#714) bumpt Dependabot hem gewoon, en
    # `sync-on-factory-bump.yml` heelt die PR zodat de gesyncte bestanden meekomen. Dat
    # verving de zelfgebouwde `bump-factory.yml` (geretireerd). Dit bestand is de sync-bron
    # voor elke app's `.github/dependabot.yml`, dus de un-ignore propageert via `factory sync`.
    open-pull-requests-limit: 5

name: ci

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # De merge-queue toetst elke PR tegen main-plus-wat-al-in-de-queue-staat vóór
  # de merge; zonder deze trigger draait de poort niet in de queue en blijft die
  # eeuwig wachten. `factory inleveren` zet PR's in deze queue.
  merge_group:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # De action-majors (checkout, setup-node, upload-artifact) staan bewust op
      # de nieuwste major: die draaien op de node24-runtime van de runner, terwijl
      # oudere majors geforceerd worden omgezet en een deprecatiewaarschuwing geven.
      # Dit gaat om de runtime van de acties zelf — de project-node is 22 (zie
      # .nvmrc, hieronder via node-version-file gelezen).
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De app-kopieën van de gesyncte factory-bestanden (slash commands, skills,
      # git hook, CI-workflow) moeten gelijk zijn aan de gebruikte factory-versie.
      # Faalt dit, draai dan lokaal `factory sync` en commit het verschil.
      - name: Sync-drift controleren
        run: pnpm exec factory sync --check

      # Dezelfde poort als lokaal: factory verify draait deze stappen in deze volgorde.
      - run: pnpm exec factory verify

      - name: Contracten bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacts
          path: pacts/
          if-no-files-found: ignore

name: ci

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Majors op node24: oudere majors worden door de runner geforceerd
      # omgezet en geven een deprecatiewaarschuwing.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dezelfde poort als lokaal: factory verify draait deze stappen in deze volgorde.
      - run: pnpm exec factory verify

      - name: Contracten bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacts
          path: pacts/
          if-no-files-found: ignore

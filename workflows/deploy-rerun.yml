name: deploy-rerun

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.
#
# Vangnet voor #122. Bewaakt inmiddels ook `bump-factory`, ondanks de naam: die volgt
# het bestand, en een rename zou in vijf repo's een wees achterlaten.
#
# De runner haalt externe actions op vóór er een factory-shellstap draait — sinds #270
# op de mini alleen nog `actions/checkout`; `setup-node` en `pnpm/action-setup` zijn
# daar weg omdat node en pnpm er al staan. Dat downloaden valt buiten het
# #99-retry-vangnet, dat alleen om factory's eigen shell-stappen (git push/fetch, pnpm
# install) zit. Faalt het op een transiente hik, dan valt de hele job om: bij een
# deploy blijft prod stil op de oude versie (#112), bij een bump haalt de app de
# nieuwe factory-tag niet.
#
# Deze workflow draait ná een afgeronde `deploy`- of `bump-factory`-run. Faalde die op
# de action-download-signatuur, dan start hij de gefaalde jobs eenmalig opnieuw. Alleen
# bij de eerste poging (run_attempt == 1), zodat een echte bouwfout na één rerun
# alsnog rood blijft en niet in een lus opnieuw draait. Draait op een GitHub-hosted
# runner (niet de mini): het is puur een gh-API-aanroep, en zo raakt de rerun-trigger
# zelf de mini-DNS-blip niet.

on:
  workflow_run:
    # Ook `bump-factory`: alle vijftien de action-download-mislukkingen in de week tot
    # 2026-08-21 zaten in díe workflow, en die had geen vangnet (#270). De deploy had
    # het al sinds #122.
    workflows: [deploy, bump-factory]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    # Alleen na een gefaalde eerste poging. run_attempt == 2 (de rerun zelf) valt
    # hierbuiten, dus er volgt hooguit één herstart.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Eenmalige rerun bij een action-download-fout
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # Alleen reruns op de action-download-signatuur (#122). Een echte bouw- of
          # deploy-fout moet meteen rood blijven, niet stilletjes opnieuw draaien.
          if gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
              | grep -qiE "Failed to download action|Back off [0-9.]+ seconds before retry"; then
            echo "::notice::Action-download-fout in run $RUN_ID — eenmalige rerun van de gefaalde jobs."
            gh run rerun "$RUN_ID" --failed --repo "$REPO"
          else
            echo "::notice::Run $RUN_ID faalde niet op een action-download; geen rerun (echte fout)."
          fi

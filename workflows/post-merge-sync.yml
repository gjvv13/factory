name: post-merge-sync

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.
#
# Na het mergen van een Dependabot factory-bump-PR draait deze workflow
# `factory sync` zodat workflows, skills, hooks en commands automatisch
# meelopen met de nieuwe factory-versie (#456). Triggert op elke push naar
# main die package.json raakt; stap 1 controleert of de factory-dep echt
# veranderd is, zodat een ongerelateeerde package.json-wijziging geen
# nutteloze commit oplevert.
#
# Draait op ubuntu-latest (geen self-hosted): het is puur een install +
# sync + push, geen deploy en geen prod-toegang. Heeft PROJECT_TOKEN
# nodig (PAT met `repo` + `workflow`): het ingebouwde GITHUB_TOKEN mag
# geen workflow-bestanden schrijven (#245), en `factory sync` brengt die
# wel mee.

on:
  push:
    branches: [main]
    paths: [package.json]

# Eén sync tegelijk, zodat twee snelle pushes niet met een race naar dezelfde
# bestanden conflicteren.
concurrency:
  group: post-merge-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2
          # PROJECT_TOKEN: PAT met `repo` + `workflow`, zodat de push
          # workflow-bestanden mag schrijven (#245) en deploy.yml triggert.
          token: ${{ secrets.PROJECT_TOKEN || github.token }}

      - name: Controleer of de factory-dep veranderd is
        id: check
        run: |
          if git diff HEAD~1 HEAD -- package.json | grep -qE '^\+.*"factory":\s*"git\+https://'; then
            echo "veranderd=ja" >> "$GITHUB_OUTPUT"
          else
            echo "factory-dep niet veranderd — niets te doen."
            echo "veranderd=nee" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.veranderd == 'ja'
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.veranderd == 'ja'

      - name: Dependencies installeren en factory sync draaien
        if: steps.check.outputs.veranderd == 'ja'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec factory sync

      - name: Commit en push als er een diff is
        if: steps.check.outputs.veranderd == 'ja'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Geen wijzigingen na factory sync — niets te committen."
          else
            versie=$(node -p "require('./package.json').devDependencies.factory.split('#').pop()")
            git commit -m "sync: factory $versie propagatie"
            git push origin main
          fi

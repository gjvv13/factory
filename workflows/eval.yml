name: eval

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.
#
# Het regressienet (#361): draait `factory eval` wanneer een wijziging de werker-prompt,
# het onbemand-werken-contract of de gouden set kan raken. Zo wordt een prompt- of
# skill-wijziging die de onbemande werker slechter maakt zichtbaar vóór hij een nacht
# lang draait.
#
# Draait op de self-hosted runner op de mini: de eval roept `claude` lokaal aan, en dat
# kan alleen op een machine die daarvoor is ingericht (net als deploy.yml). De exitcode
# van `factory eval` bepaalt of deze workflow faalt — bij "eval": "blokkeer" in
# package.json faalt hij op een regressie, bij "waarschuw" blijft hij groen met een
# waarschuwing.
#
# Zonder `eval/gouden-set.json` in de repo (de meeste apps hebben er geen) is deze
# workflow een no-op: hij slaat alles na de checkout over. Zo breekt het gesynchroniseerde
# bestand een app niet die geen gouden set voert.
#
# Eenmalige setup in de repo:
#   - een self-hosted runner met het label `mini` (zie scripts/setup-runner.sh);
#   - een repo-secret `CLAUDE_CODE_OAUTH_TOKEN` waarmee `claude` onbemand inlogt.

on:
  push:
    branches: [main]
    # Alleen draaien als de invoer van de eval kan zijn veranderd: de werker-prompts,
    # het onbemand-werken-contract, of de gouden set zelf. Anders is er niets nieuws te
    # meten en zou elke merge onnodig een dure claude-run starten.
    paths:
      - 'templates/werker-*.md'
      - 'skills/onbemand-werken/**'
      - 'eval/gouden-set.json'
  workflow_dispatch:

# Serieel: twee evals tegelijk op één machine zouden om dezelfde claude-auth strijden.
concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v7

      # De gouden set woont in de factory-repo; een app die er geen voert slaat alles over.
      - name: Gouden set aanwezig?
        id: check
        run: |
          if [ -f eval/gouden-set.json ]; then
            echo "aanwezig=true" >> "$GITHUB_OUTPUT"
          else
            echo "aanwezig=false" >> "$GITHUB_OUTPUT"
            echo "Geen eval/gouden-set.json in deze repo — regressienet niet van toepassing."
          fi

      # Geen `actions/setup-node` en `pnpm/action-setup` op de mini: node staat er al
      # (de runner-`.env` zet `NVM_BIN`) en pnpm komt uit `corepack`. Die twee actions
      # werden élke job opnieuw van codeload gehaald en dáár liepen runs op stuk (#270).
      - name: Node en pnpm van de runner
        if: steps.check.outputs.aanwezig == 'true'
        run: |
          verwacht=$(tr -d ' \n' < .nvmrc)
          huidig=$(node -p "process.versions.node.split('.')[0]")
          if [ "$huidig" != "$verwacht" ]; then
            echo "::warning::de runner draait node $huidig, maar .nvmrc vraagt $verwacht — wordt automatisch geremedieerd."
            . "$HOME/.nvm/nvm.sh"
            if ! nvm install "$verwacht"; then
              echo "::error::nvm install $verwacht mislukte — de run was zonder zelfherstel ook rood geweest."
              exit 1
            fi
            nvm use "$verwacht"
            echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"
          fi
          corepack enable pnpm
          echo "node $(node --version), pnpm $(pnpm --version)"

      # Bounded retry rond de install: de mini heeft af en toe een transiente DNS-blip (#99).
      - name: Dependencies installeren (met DNS-retry)
        if: steps.check.outputs.aanwezig == 'true'
        run: |
          if pnpm install --frozen-lockfile; then exit 0; fi
          for poging in 2 3; do
            echo "::warning::pnpm install faalde (poging $((poging - 1))/3) — opnieuw over $(((poging - 1) * 5))s…"
            sleep $(((poging - 1) * 5))
            if pnpm install --frozen-lockfile; then exit 0; fi
          done
          echo "::error::pnpm install bleef falen na 3 pogingen"
          exit 1

      # De eval draait de werker en de judge via `claude`; die logt onbemand in met de
      # token. Zonder de token vraagt claude om een login en doet daarna stil niets.
      - name: Regressienet draaien
        if: steps.check.outputs.aanwezig == 'true'
        run: pnpm exec factory eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

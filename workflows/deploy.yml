name: deploy

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.
#
# Rolt elke merge naar main automatisch uit: eerst naar acc, daarna naar prod.
# Draait op een self-hosted runner op de mini (prod draait als pm2 op 127.0.0.1 en
# is voor een GitHub-hosted runner onbereikbaar).
#
# De prod-poort: bevat de change een nieuwe DB-migratie, dan rolt prod NIET
# automatisch uit (migraties rollen niet terug) maar draait de `migratie-melding`-job,
# die vraagt om een handmatige `factory promote prod`. Zonder migratie gaat prod
# automatisch door. (Environment-required-reviewers zijn op private persoonlijke repos
# niet beschikbaar — Team/Enterprise-only — vandaar deze handmatige stap.)
#
# Eenmalige setup in de app-repo:
#   - een self-hosted runner op de mini met het label `mini`, als je gebruiker
#     (pm2 + ~/AppEnvs bereikbaar) — zie factory/scripts/setup-runner.sh;
#   - een repo-secret `PROD_SECRETS_ENV` met de volledige inhoud van
#     environments/prod.secrets.env (die staat niet in git; de verse checkout van de
#     runner heeft 'm nodig om prod met secrets te starten).
#
# Optioneel, voor de melding bij een gefaalde deploy (#112): een repo-variabele
# `DEPLOY_NOTIFY_URL` (het assistent-endpoint dat naar Matrix relayt) en een
# repo-secret `DEPLOY_NOTIFY_TOKEN`. Zonder die variabele slaat de meldstap
# over met een waarschuwing — de deploy zelf verandert er niet door.

on:
  push:
    branches: [main]

# Uitrollen blijft serieel: een nieuwe merge wacht op de lopende deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  acc:
    # De release-commit (versie-bump) is zelf een push naar main; sla die over,
    # anders rolt de deploy zichzelf in een lus.
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: [self-hosted, mini]
    outputs:
      migratie: ${{ steps.migratie.outputs.nieuw }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          # Per job een eigen pnpm-installatie. Twee runners op dezelfde mini draaien
          # als dezelfde gebruiker en delen anders ~/setup-pnpm + de store; bij
          # parallelle deploys slopen ze elkaar (ENOTEMPTY / verdwenen worker.js).
          dest: ${{ runner.temp }}/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Geen cache: pnpm — die deelt de store-map en veroorzaakt dezelfde botsing;
          # op een blijvende self-hosted runner levert de Actions-cache weinig op.
      # Bounded retry rond de install: de mini heeft af en toe een transiente DNS-blip
      # naar codeload/de registry (#99). We herhalen een install-fout max 3× met
      # oplopende backoff. Onvoorwaardelijk (niet DNS-specifiek zoals in de CLI): in CI
      # is grep-op-stderr broos, en een deterministische fout (lockfile-mismatch) faalt
      # zo alsnog snel en netjes na drie korte pogingen.
      - name: Dependencies installeren (met DNS-retry)
        run: |
          for poging in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [ "$poging" -lt 3 ]; then
              echo "::warning::pnpm install faalde (poging $poging/3) — opnieuw over $((poging * 5))s…"
              sleep "$((poging * 5))"
            fi
          done
          echo "::error::pnpm install bleef falen na 3 pogingen"
          exit 1
      - name: Git-identiteit voor de release-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # release: verify + versie-bump + tag + push. promote acc: verse uitrol met
      # herladen env en zichtbare config. Acc heeft geen secrets nodig.
      - run: pnpm exec factory deploy acc
      # Rooktest acc: één read-only aanroep door de kern (#121). /health zegt "ok" ook
      # als het brein eruit ligt; dit bewijst dat de app echt antwoordt. Faalt hij, dan
      # wordt de job rood en meldt de gefaalde-deploy-stap dat. No-op zonder een rooktest
      # in factory.json. Acc eerst: de logische plek om een kapotte kern als eerste te zien.
      - run: pnpm exec factory rooktest acc
      # Bepaalt na de release of prod via de goedkeurings-poort moet. De factory-
      # binary rechtstreeks (niet via `pnpm exec`): pnpm print anders een ruis-regel
      # ("Lockfile is up to date…") die de command-substitutie en daarmee
      # $GITHUB_OUTPUT breekt. tail -n1 pakt puur de laatste regel (ja/nee).
      - id: migratie
        run: echo "nieuw=$(node_modules/.bin/factory heeft-migratie | tail -n1)" >> "$GITHUB_OUTPUT"
      # Meldt een gefaalde deploy aan de assistent (die relayt naar Matrix), zodat een
      # stille mislukking prod niet ongemerkt op de oude versie laat staan (#112). Faalt
      # de acc-stap, dan draait de prod-job niet en blijft prod dus óók achter — vandaar
      # ook hier. Draait met if:failure() ook als een eerdere stap omviel (bijv. de
      # action-download, #122); het heeft de checkout niet nodig. No-op met een
      # waarschuwing als DEPLOY_NOTIFY_URL niet is gezet.
      - name: Melden bij een gefaalde deploy
        if: failure()
        env:
          NOTIFY_URL: ${{ vars.DEPLOY_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bericht="⚠ ${{ github.repository }}: deploy (acc) mislukt — prod draait mogelijk nog de oude versie. Run: $run_url"
          if [ -z "$NOTIFY_URL" ]; then
            echo "::warning::$bericht — geen melding verstuurd (DEPLOY_NOTIFY_URL niet gezet)."
            exit 0
          fi
          curl -fsS -m 10 -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"tekst\":\"$bericht\"}" \
            || echo "::warning::kon de deploy-melding niet aan de assistent versturen."

  # Alleen zónder migratie automatisch naar prod. Migraties rollen niet terug, dus
  # bij een nieuwe migratie draait i.p.v. deze job de `migratie-melding`-job hieronder.
  prod:
    needs: acc
    if: ${{ needs.acc.outputs.migratie != 'ja' }}
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          # Per job een eigen pnpm-installatie. Twee runners op dezelfde mini draaien
          # als dezelfde gebruiker en delen anders ~/setup-pnpm + de store; bij
          # parallelle deploys slopen ze elkaar (ENOTEMPTY / verdwenen worker.js).
          dest: ${{ runner.temp }}/pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Geen cache: pnpm — die deelt de store-map en veroorzaakt dezelfde botsing;
          # op een blijvende self-hosted runner levert de Actions-cache weinig op.
      # Bounded retry rond de install: de mini heeft af en toe een transiente DNS-blip
      # naar codeload/de registry (#99). We herhalen een install-fout max 3× met
      # oplopende backoff. Onvoorwaardelijk (niet DNS-specifiek zoals in de CLI): in CI
      # is grep-op-stderr broos, en een deterministische fout (lockfile-mismatch) faalt
      # zo alsnog snel en netjes na drie korte pogingen.
      - name: Dependencies installeren (met DNS-retry)
        run: |
          for poging in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [ "$poging" -lt 3 ]; then
              echo "::warning::pnpm install faalde (poging $poging/3) — opnieuw over $((poging * 5))s…"
              sleep "$((poging * 5))"
            fi
          done
          echo "::error::pnpm install bleef falen na 3 pogingen"
          exit 1
      # De verse checkout mist de untracked *.secrets.env; prod heeft die wél nodig.
      # We schrijven ze uit het repo-secret vlak vóór de uitrol. De secret gaat via
      # het env-blok, NIET direct als ${{ secrets.* }} in het run-commando: bij een
      # waarde met quotes/JSON (bijv. USERS=[{...}]) zou de shell-string anders breken
      # en de weggeschreven waarde corrupt raken.
      - name: Prod-secrets materialiseren
        env:
          PROD_SECRETS_ENV: ${{ secrets.PROD_SECRETS_ENV }}
        run: printf '%s' "$PROD_SECRETS_ENV" > environments/prod.secrets.env
      # deploy prod promoveert de bestaande (nieuwste) tag naar prod; geen nieuwe
      # release. Komt prod niet gezond op (of meldt /health een andere versie dan de
      # tag), dan faalt promote luid en geldt de proces-rollback.
      - run: pnpm exec factory deploy prod
      # Rooktest prod: bewijst dat de kern echt antwoordt na de uitrol (#121). Faalt hij,
      # dan wordt de prod-job rood (+ melding hieronder); terugrollen is bewust handmatig
      # (`factory terugrol prod`), niet automatisch. No-op zonder rooktest in factory.json.
      - run: pnpm exec factory rooktest prod
      # Zie de toelichting bij de acc-job: meldt een gefaalde prod-deploy aan de
      # assistent zodat prod niet stil op de oude versie achterblijft (#112).
      - name: Melden bij een gefaalde deploy
        if: failure()
        env:
          NOTIFY_URL: ${{ vars.DEPLOY_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bericht="⚠ ${{ github.repository }}: prod-deploy mislukt — prod draait mogelijk nog de oude versie. Run: $run_url"
          if [ -z "$NOTIFY_URL" ]; then
            echo "::warning::$bericht — geen melding verstuurd (DEPLOY_NOTIFY_URL niet gezet)."
            exit 0
          fi
          curl -fsS -m 10 -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"tekst\":\"$bericht\"}" \
            || echo "::warning::kon de deploy-melding niet aan de assistent versturen."

  # Migratie-poort zonder betaald environment. Environment-required-reviewers zijn op
  # private persoonlijke repos niet beschikbaar (Team/Enterprise-only), dus we rollen
  # prod bij een nieuwe migratie NIET automatisch uit maar melden dat er een handmatige
  # promote nodig is. De run blijft groen: prod is bewust overgeslagen, niet gefaald.
  migratie-melding:
    needs: acc
    if: ${{ needs.acc.outputs.migratie == 'ja' }}
    runs-on: ubuntu-latest
    steps:
      - name: Migratie gedetecteerd — prod handmatig uitrollen
        run: |
          echo "::warning::Nieuwe DB-migratie in deze release — prod is NIET automatisch uitgerold. Rol handmatig uit met: factory promote prod"
          {
            echo "### ⚠️ Migratie gedetecteerd — prod niet automatisch uitgerold"
            echo ""
            echo "Deze release bevat een nieuwe DB-migratie. Migraties rollen niet automatisch"
            echo "terug, dus prod wacht op een handmatige stap. Toets de migratie op acc en rol"
            echo "prod dan uit met:"
            echo ""
            echo '```'
            echo "factory promote prod"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

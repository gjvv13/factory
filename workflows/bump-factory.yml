name: bump-factory

# Dit bestand wordt beheerd door de factory. Wijzig het daar en haal het
# hier op met `factory sync`.
#
# Houdt de app automatisch op de nieuwste factory (#132). Is er een nieuwere factory dan
# in package.json staat, dan bumpt hij de dep, draait `factory sync` (zodat CLI én
# workflow/skill/hook-wijzigingen meekomen), commit dat naar main en tript de
# deploy-pijplijn af. Zo bereikt een factory-release deze app zonder handwerk.
#
# Model-bewust (#695/#708): een git-dep (`git+…#<tag>`) bumpt naar de nieuwste git-tag,
# een registry-dep (`^<versie>`) naar de nieuwste npm-versie. Zo bedient één workflow
# gemigreerde én niet-gemigreerde apps tijdens de git→registry-migratie. De sync draait
# ongeacht het model, want gesyncte bestanden (workflows/skills/hooks) komen bij elke
# factory-release mee — daarom volstaat dependabot alléén niet (dat draait geen sync).
#
# De factory **vertelt** het zelf: `release.yml` daar dispatcht deze workflow zodra de tag
# staat (#236). De cron is alleen nog het vangnet voor een gemiste dispatch en draait
# daarom één keer per dag. Hij stond op elke 30 minuten: dat waren 165 runs per dag over
# vijf apps, met 7 mislukkingen — allemaal in `Set up job`, de fase waarin de runner zijn
# actions ophaalt, waar geen retry in de workflow mogelijk is (#99, #122). Zeven mails per
# dag voor een vraag die bijna altijd "niets veranderd" oplevert.
#
# Draait op de mini-runner (dezelfde als de deploy). De push gaat met `PROJECT_TOKEN`, een
# PAT met `repo` + `workflow`: het ingebouwde GITHUB_TOKEN mag geen workflow-bestanden schrijven
# en `factory sync` brengt die wel mee (#245). Zo'n push triggert `deploy.yml` zelf, dus
# hier wordt niets gedispatcht. De bestaande vangnetten (rooktest, versie-check,
# migratie-gate, dekkings-ratchet) blijven op die uitrol gelden.

on:
  # Vangnet, niet de gewone weg: de release dispatcht deze workflow zelf (#236). Eén keer
  # per dag betekent dat een gemiste dispatch binnen 24 uur zelf herstelt.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: bump-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: [self-hosted, mini]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # `factory sync` brengt ook workflow-wijzigingen mee, en die mag het ingebouwde
          # GITHUB_TOKEN niet pushen — GitHub weigert dat met `remote rejected` (#245).
          # Vandaar `PROJECT_TOKEN`: het pijplijn-PAT dat al in elke app-repo staat en
          # `repo` + `workflow` heeft. Eén token, twee rollen — het board schrijven en dit
          # pushen (#257). Ontbreekt het secret, dan valt de checkout terug op het
          # ingebouwde token en stopt de bump-stap hieronder met een duidelijke melding
          # vóór hij iets probeert te pushen.
          token: ${{ secrets.PROJECT_TOKEN || github.token }}
      # Geen `actions/setup-node` en `pnpm/action-setup` op de mini: node staat er al
      # (de runner-`.env` zet `NVM_BIN`) en pnpm komt uit `corepack`, met de versie uit
      # `packageManager`. Die twee actions werden élke job opnieuw van codeload gehaald —
      # ook al staat de cache er lokaal — en dáár liepen de runs op stuk: 15 van 948 runs
      # in de week tot 2026-08-21, allemaal in `Set up job` waar geen retry mogelijk is
      # (#270, restpunt van #99).
      - name: Node en pnpm van de runner
        run: |
          verwacht=$(tr -d ' \n' < .nvmrc)
          huidig=$(node -p "process.versions.node.split('.')[0]")
          if [ "$huidig" != "$verwacht" ]; then
            # Playbook: node-drift — remedieer met nvm install in plaats van exit 1.
            # De waarschuwing maakt de drift zichtbaar zonder de run rood te maken (#669).
            echo "::warning::de runner draait node $huidig, maar .nvmrc vraagt $verwacht — wordt automatisch geremedieerd."
            . "$HOME/.nvm/nvm.sh"
            if ! nvm install "$verwacht"; then
              echo "::error::nvm install $verwacht mislukte — de run was zonder zelfherstel ook rood geweest."
              exit 1
            fi
            # Propageer de geremedieerde node naar de volgende stappen: elke run:-stap start
            # met een verse shell, dus zonder deze regel blijft de bump op de oude node en
            # doet de remediatie niets (#669-review).
            nvm use "$verwacht"
            echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"
          fi
          corepack enable pnpm
          echo "node $(node --version), pnpm $(pnpm --version)"
      - name: Bump de factory als er een nieuwere versie is
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          # Lees de huidige factory-dep (scoped sleutel, oude kale `factory` als fallback).
          dep=$(node -p "const d=require('./package.json').devDependencies;d['@gjvv13/factory']||d.factory||''")
          if [ -z "$dep" ]; then
            echo "::error::geen @gjvv13/factory-dep in package.json — niets te bumpen."
            exit 1
          fi
          # Model-bewust (#695/#708): een git-dep (`git+…#<tag>`) bumpt naar de nieuwste
          # git-tag; een registry-dep (`^<versie>`) naar de nieuwste npm-versie. Zo bedient
          # één workflow gemigreerde én niet-gemigreerde apps tijdens de migratie. Een
          # mislukte opzoeking mag niet als "niets te doen" doorgaan — dat verbergt een
          # netwerkblip achter een groen vinkje (#263).
          if printf '%s' "$dep" | grep -q '#'; then
            model=git
            huidig="${dep##*#}"
            if ! tags=$(git ls-remote --tags --refs https://github.com/gjvv13/factory.git 'v*' 2>&1); then
              echo "::error::kon de factory-tags niet opvragen: ${tags:-git ls-remote gaf niets terug}. Zie #263."
              exit 1
            fi
            nieuwste=$(printf '%s' "$tags" | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -1)
            if [ -z "$nieuwste" ]; then
              echo "::error::git ls-remote lukte, maar leverde geen v*-tags op — dat klopt niet."
              exit 1
            fi
          else
            model=registry
            huidig=$(printf '%s' "$dep" | sed 's/^[~^]//')
            if ! nieuwste=$(npm view @gjvv13/factory version 2>&1); then
              echo "::error::kon de nieuwste @gjvv13/factory-versie niet opvragen: ${nieuwste:-npm view gaf niets terug}. Zie #263."
              exit 1
            fi
            if [ -z "$nieuwste" ]; then
              echo "::error::npm view lukte, maar leverde geen versie op — dat klopt niet."
              exit 1
            fi
          fi
          if [ "$huidig" = "$nieuwste" ]; then
            echo "factory al op $huidig — niets te doen."
            exit 0
          fi
          # Hier, en niet bij het begin van de run: een bump die er niet is hoeft geen
          # token en mag geen rode run opleveren.
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::geen PROJECT_TOKEN in deze repo — de bump naar $nieuwste kan niet gepusht worden. Het ingebouwde GITHUB_TOKEN mag geen workflow-bestanden schrijven (#245). Zet PROJECT_TOKEN als secret: classic PAT met de scopes repo en workflow (plus project voor het board)."
            exit 1
          fi
          echo "::notice::factory bumpen van $huidig naar $nieuwste ($model-model)"
          # Schrijf de nieuwe dep in het juiste model; migreer een oude kale `factory`-sleutel mee.
          node -e "const fs=require('fs');const p=require('./package.json');const v=process.argv[1];const model=process.argv[2];if(p.devDependencies.factory){delete p.devDependencies.factory}p.devDependencies['@gjvv13/factory']=model==='git'?('git+https://github.com/gjvv13/factory.git#'+v):('^'+v);fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$nieuwste" "$model"
          # Volledige install (niet --lockfile-only): we hebben de nieuwe factory in
          # node_modules nodig om `factory sync` ermee te draaien. `--no-frozen-lockfile`
          # is nodig omdat pnpm in CI standaard frozen is: we hebben net de factory-pin
          # in package.json opgehoogd, dus de lockfile loopt bewust achter en moet juist
          # hier meebewegen (anders faalt de install met ERR_PNPM_OUTDATED_LOCKFILE).
          # Bounded retry: dezelfde DNS-blip-bescherming als deploy.yml (#99, #668).
          install_gelukt=false
          for poging in 1 2 3; do
            if [ "$poging" -gt 1 ]; then
              echo "::warning::pnpm install faalde (poging $((poging - 1))/3) — opnieuw over $(((poging - 1) * 5))s…"
              sleep $(((poging - 1) * 5))
            fi
            if pnpm install --no-frozen-lockfile; then install_gelukt=true; break; fi
          done
          if [ "$install_gelukt" = false ]; then
            echo "::error::pnpm install bleef falen na 3 pogingen"
            exit 1
          fi
          pnpm exec factory sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bump: factory naar $nieuwste (+ sync)"
          git push origin main
          # Deze push gaat met PROJECT_TOKEN en triggert `deploy.yml` (push op main) dus wél —
          # anders dan een push met GITHUB_TOKEN. Daarom geen expliciete dispatch meer:
          # die leverde vanaf hier een tweede, identieke deploy-run op (#245).

      # Een mislukte bump was alleen een faalmail; die gaat nu naar de ops-room, waar de
      # deploy- en board-meldingen ook al langskomen (#123, #236). Draait ook als een
      # eerdere stap omviel — inclusief `Set up job`-fouten die de checkout nooit haalden,
      # vandaar geen enkele afhankelijkheid van bestanden uit de repo.
      - name: Melden bij een gefaalde bump
        if: failure()
        env:
          NOTIFY_URL: ${{ vars.DEPLOY_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bericht="⚠ ${{ github.repository }}: bump naar de nieuwste factory mislukt. Run: $run_url"
          if [ -z "$NOTIFY_URL" ]; then
            echo "::warning::$bericht — geen melding verstuurd (DEPLOY_NOTIFY_URL niet gezet)."
            exit 0
          fi
          curl -fsS -m 10 -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"tekst\":\"$bericht\"}" \
            || echo "::warning::kon de bump-melding niet aan de assistent versturen."

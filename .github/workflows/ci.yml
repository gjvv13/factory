name: ci

# Bewust een hand-onderhouden variant van de app-template `workflows/ci.yml`.
# De factory synct zichzelf niet (geen factory.json) en gebruikt `/bouw` niet,
# dus de sync-drift-stap uit de template hoort hier niet thuis; deze CI draait
# alleen de eigen poort via `node dist/cli.js verify`. Wijzig je de template
# (nieuwe stap of action-bump), werk dan dit bestand met de hand bij — niets
# bewaakt de divergentie. Bump-plekken: actions/checkout, actions/setup-node,
# pnpm/action-setup (majors op node24, zie het commentaar hieronder).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # De merge-queue toetst elke PR vóór de merge; zonder deze trigger draait de
  # poort niet in de queue en blijft die wachten. `factory inleveren` gebruikt 'm.
  merge_group:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Majors op node24: oudere majors worden door de runner geforceerd
      # omgezet en geven een deprecatiewaarschuwing.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De factory toetst zichzelf met haar eigen poort.
      - run: node dist/cli.js verify

  # Agent-rooktest (#673): toetst discovery, boundary en symlink-resolutie
  # van de agent-definities. Draait alleen op push naar main als bestanden
  # onder agents/ of .claude/agents/ veranderd zijn — te duur en auth-gebonden
  # voor elke PR. Gebruikt de mini-runner waar claude geïnstalleerd en
  # geauthenticeerd is.
  agent-rooktest:
    runs-on: mini
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Controleer of agent-definities veranderd zijn
        id: changes
        run: |
          # Volledige push-range (event.before..sha), niet alleen de laatste commit:
          # bij een merge- of multi-commit-push zou HEAD~1..HEAD agents/-wijzigingen in
          # eerdere commits missen en de rooktest onterecht overslaan (#673-review).
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(agents/|\.claude/agents/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.changed == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.changed == 'true'

      - run: pnpm test:agent-rooktest
        if: steps.changes.outputs.changed == 'true'
        env:
          FACTORY_AGENT_ROOKTEST: '1'
        # Worst case: 4 rollen × 2 seriële claude-aanroepen × 25s spawnSync-timeout = 200s.
        # 2 min was te krap en kon de job killen vóór de test klaar was (#673-review).
        timeout-minutes: 5

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Majors op node24: oudere majors worden door de runner geforceerd
      # omgezet en geven een deprecatiewaarschuwing.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De factory toetst zichzelf met haar eigen poort.
      - run: node dist/cli.js verify

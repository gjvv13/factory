# Spike #367 — native GitHub @claude-integratie naast de eigen factory.
#
# TIJDELIJK. Dit bestand hoort bij de spike die onderzoekt of de native
# @claude-actie een deel van de factory-orkestratie kan vervangen/aanvullen.
# Bij een no-go wordt dit bestand weer verwijderd (zie de acceptatiecriteria in
# issue #367). Niet als vast onderdeel van de pijplijn behandelen.
#
# Auth: draait op een OAuth-token van het Claude-abonnement, als repo-secret
# CLAUDE_CODE_OAUTH_TOKEN. De token-waarde staat alleen in GitHub, nergens in code.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Alleen een runner starten als er echt "@claude" in de trigger staat —
    # anders draait dit op elke comment (verspilde runs, zie de efficiency-les
    # uit de bump-factory-cron #99).
    #
    # Actor-guard (#367): de actie plaatst zelf een tracking-comment; die vuurt
    # `issue_comment` af en zou anders een tweede run starten. `sender.type != 'Bot'`
    # sluit elke door een App/bot getriggerde gebeurtenis uit — login-onafhankelijk,
    # dus robuuster dan een naam-check op `claude[bot]`.
    if: |
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # Gepind op de commit-SHA achter v1 (#367 / ADR 010): externe adoptie pint
        # op commit, geen auto-update. Optrekken = SHA verversen na een review van de
        # nieuwe tag. Los `gh api repos/anthropics/claude-code-action/git/refs/tags/v1`
        # op om de huidige SHA te vinden.
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

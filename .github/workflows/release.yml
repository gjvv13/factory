name: release

# Auto-release van de factory zelf (#132). De apps rollen al automatisch uit bij een
# merge; de factory deed dat niet, want ze is gereedschap en geen draaiende app — er
# was alleen een handmatige `factory release`. Deze workflow zet bij elke merge naar
# main een nieuwe versie, zodat een pijplijn-verbetering vanzelf vrijkomt. De apps
# pikken die versie daarna zelf op via Dependabot (#743).
#
# main is beschermd door de ruleset "main merge queue" (wijzigingen alleen via een PR
# met een groene `verify`). Daarom pusht deze release NIET direct: hij zet de tag meteen
# (tags vallen buiten de ruleset, dus de apps kunnen direct bumpen) en bumpt main's
# package.json via een auto-merge-PR. Die PR wordt met een PAT (`RELEASE_PAT`) aangemaakt,
# niet met github.token: een GITHUB_TOKEN-PR triggert `ci.yml` niet, dus de verplichte
# `verify`-check verschijnt nooit en de auto-merge zou eeuwig hangen (#163). Zonder PAT
# slaat de PR-stap over — de tag (en dus de release) komt hoe dan ook vrij. Draait op een
# GitHub-hosted runner: puur git + gh, geen prod nodig.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Versie-sprong'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Niet opnieuw releasen op de merge van een release-PR (voorkomt een lus): die
    # merge-commit noemt de `gjvv13/release/*`-bronbranch. Een `release:`-commit slaan
    # we ook over. Een handmatige dispatch draait altijd.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      ( !startsWith(github.event.head_commit.message, 'release:')
      && !contains(github.event.head_commit.message, 'gjvv13/release/') ) }}
    runs-on: ubuntu-latest
    # Voor de meldjob hieronder (#195): welke items bleven liggen, en bij welke tag.
    outputs:
      bord_overgeslagen: ${{ steps.bump.outputs.bord_overgeslagen }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependencies installeren (met DNS-retry)
        run: |
          for poging in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [ "$poging" -lt 3 ]; then sleep "$((poging * 5))"; fi
          done
          echo "::error::pnpm install bleef falen na 3 pogingen"
          exit 1
      - name: Git-identiteit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump op een release-branch, tag, en open een auto-merge-PR
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          # De PR-stappen draaien met een PAT i.p.v. github.token: een PR die met
          # GITHUB_TOKEN wordt aangemaakt triggert `ci.yml` niet, dus de verplichte
          # `verify`-check verschijnt nooit en de auto-merge hangt eeuwig (#163). Een
          # PAT-PR triggert de checks wél en merget dus vanzelf.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          # Het board hangt onder een persoonlijk account en de backlog in dit repo; het
          # ingebouwde GITHUB_TOKEN komt daar niet bij. `factory afronden` (#185) gebruikt
          # deze PAT via board.ts; ontbreekt hij, dan slaat de board-stap zacht over.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Publiceren naar de publieke npm-registry (#714). Ontbreekt het token, dan
          # slaat de publish-stap zacht over — net als RELEASE_PAT/PROJECT_TOKEN.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bump="${{ github.event.inputs.bump || 'patch' }}"
          # De volgende versie leiden we af van de NIEUWSTE git-tag, niet van de versie
          # in package.json op main. De tag is de echte bron van "wat is de laatste
          # release" — de apps bumpen er ook op — en main's package.json kan tijdelijk
          # achterlopen: de PR die hem bijwerkt kan nog in de lucht zijn, of ontbreken als
          # RELEASE_PAT niet gezet is. Rekenen vanuit package.json bevroor de versie
          # anders op een al-bestaande tag ("niets te releasen") — dan werd elke merge een
          # no-op. Vanaf de tag bumpen geeft opeenvolgende merges nette, oplopende tags,
          # ongeacht de staat van main.
          git fetch --tags --force origin >/dev/null 2>&1 || true
          laatste="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$laatste" ]; then
            echo "::error::geen v*-tags gevonden na git fetch — de taglijst is leeg. Maak handmatig een initiële tag aan (bijv. v0.0.0) en draai de workflow opnieuw."
            exit 1
          fi
          # Reken de volgende versie rekenkundig uit de tag. Niet via `pnpm version`: dat
          # eist een schone git-tree, en we bumpen niet vanuit package.json (die loopt
          # achter). npm pkg set schrijft de nieuwe versie pas ná de branch-checkout, dus
          # de tree blijft tot dan schoon.
          nieuw="$(node -e "const [a,b,c]=process.argv[1].replace(/^v/,'').split('.').map(Number); const t=process.argv[2]; console.log(t==='major'?[a+1,0,0].join('.'):t==='minor'?[a,b+1,0].join('.'):[a,b,c+1].join('.'))" "$laatste" "$bump")"
          v="v$nieuw"
          if git ls-remote --tags --exit-code origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "::notice::$v bestaat al — niets te releasen."
            exit 0
          fi
          git checkout -b "release/$v"
          npm pkg set version="$nieuw" >/dev/null
          git add package.json
          git commit -m "release: $v"
          # Tag op de bump-commit; tags vallen buiten de branch-ruleset, dus dit mag
          # direct. Dit is wat telt: de apps bumpen op de tag, niet op main's
          # package.json. De tag gaat als eerste de deur uit, zodat de release hoe dan ook
          # vrijkomt — ook als de PR-kant hieronder ontbreekt of faalt.
          git tag -a "$v" -m "Release $v"
          git push origin "$v"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          # Publiceren naar de publieke npm-registry (#714), zodat apps/CI/mini/lokaal de
          # factory als tarball installeren (`npm i -g @gjvv13/factory@<versie>`). Een
          # git-install van deze pnpm-repo crasht in npm (#707); een tarball draagt de
          # gebouwde dist (het `files`-veld) → geen prepare, geen build-poort. Staat vóór
          # het RELEASE_PAT-afsplitspunt, zodat publiceren losstaat van de PR-kant. Zonder
          # NPM_TOKEN: waarschuwen en overslaan (net als PROJECT_TOKEN/RELEASE_PAT), zodat
          # de tag hoe dan ook vrijkomt. `npm publish` bouwt dist zelf via prepare/prepack.
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN niet gezet — $v niet naar npm gepubliceerd; consumenten kunnen deze versie niet uit de registry halen. Zie #714."
          else
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            if npm publish --access public 2>npm_publish_err.txt; then
              echo "::notice::$v gepubliceerd naar npm (@gjvv13/factory)"
            else
              reden=$(tr -d '\r' < npm_publish_err.txt | grep -v '^[[:space:]]*$' | tail -1 | cut -c1-200)
              echo "::warning::kon $v niet naar npm publiceren: ${reden:-npm zei niets}. Zie #714."
            fi
            rm -f "$HOME/.npmrc" npm_publish_err.txt
          fi
          # Factory-eigen backlog-items uit dit tagbereik naar Done (#185). De factory
          # draait geen `promote prod`, dus de release-tag ís haar Done-moment. Dit staat
          # vóór het RELEASE_PAT-afsplitspunt hieronder, zodat het ook gebeurt als er geen
          # release-PR komt. Een bordfout mag de release nooit rood maken — vandaar de `||`.
          # Bleef er iets liggen, dan zet `afronden` zelf `bord_overgeslagen` als uitvoer
          # en meldt de job hieronder het (#195).
          node dist/cli.js afronden "$laatste" "$v" \
            || echo "::warning::kon het board niet bijwerken voor $v (zie #185); de tag $v staat er wel."
          # Achterhaalde release-PR's opruimen (#671). Nu $v getagd is, is elke nog-open
          # `release/v<lager>`-PR per definitie achterhaald: sluiten met branch-opruiming en
          # een uitleg-comment. Draait met de ingebouwde GITHUB_TOKEN (de step-env zet
          # GH_TOKEN daarop; pull-requests + contents write volstaan, RELEASE_PAT is niet
          # nodig in hetzelfde repo). Soft-fail — een opruimfout mag de release nooit
          # blokkeren (`factory opruimen` is de terugval). Staat vóór het RELEASE_PAT-
          # afsplitspunt, zodat het ook opruimt als er geen nieuwe release-PR komt. De
          # zojuist te openen `release/$v`-PR bestaat hier nog niet, dus die raakt het niet.
          if openReleasePrs=$(gh pr list --repo gjvv13/factory --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/v")) | "\(.number) \(.headRefName)"'); then
            printf '%s\n' "$openReleasePrs" | while read -r nr ref; do
              [ -z "$nr" ] && continue
              prVersie="${ref#release/v}"
              # Strikt lager dan $nieuw (kale versie) → achterhaald. Zelfde numerieke
              # vergelijking per onderdeel als de bump-berekening hierboven; exit 0 = lager.
              if node -e "const a=process.argv[1].replace(/^v/,'').split('.').map(Number),b=process.argv[2].replace(/^v/,'').split('.').map(Number);for(let i=0;i<3;i++){if((a[i]||0)!==(b[i]||0))process.exit((a[i]||0)<(b[i]||0)?0:1)}process.exit(1)" "$prVersie" "$nieuw"; then
                gh pr close "$nr" --repo gjvv13/factory --delete-branch \
                  --comment "Achterhaald: $v is al getagd." \
                  || echo "::warning::kon de achterhaalde release-PR #$nr niet sluiten; $v staat er wel."
              fi
            done
          else
            echo "::warning::kon de open release-PR's niet ophalen voor opruiming (#671); $v staat er wel."
          fi
          # De apps pikken een nieuwe factory-versie nu zelf op via Dependabot (#743): sinds
          # factory publiek op de registry staat (#714) bumpt Dependabot de @gjvv13/factory-dep,
          # en `sync-on-factory-bump.yml` heelt die PR zodat de gesyncte bestanden meekomen.
          # De oude release→bump-factory-dispatch (#236) is daarmee vervallen; `bump-factory.yml`
          # is geretireerd. Geen expliciete trigger meer nodig — Dependabot draait op zijn eigen
          # schema en is de bron.
          # De PR bumpt main's package.json mee, zodat main gelijk blijft lopen met de
          # tags. Hij merget alleen vanzelf als hij met een PAT wordt aangemaakt (zie de
          # env-comment). Zonder RELEASE_PAT slaan we de PR bewust over — dan zou hij toch
          # blijven hangen en alleen litter opleveren (#163). De tag staat er dan al.
          if [ -z "$RELEASE_PAT" ]; then
            echo "::warning::RELEASE_PAT niet gezet — geen release-PR aangemaakt (de tag $v staat er wel; main's package.json loopt achter). Zie #163."
            exit 0
          fi
          git push origin "release/$v"
          GH_TOKEN="$RELEASE_PAT" gh pr create --base main --head "release/$v" \
            --title "release: $v" \
            --body "Automatische versie-bump (#132). De tag $v is al gezet op de bump-commit." \
            || echo "::warning::kon de release-PR niet openen — de tag $v staat er wel."
          GH_TOKEN="$RELEASE_PAT" gh pr merge "release/$v" --auto --merge --delete-branch \
            || echo "::warning::kon auto-merge niet inschakelen op de release-PR (tag $v staat er wel)."

  # De globale factory-bin op de mini verversen bij een release (#505). De nacht-
  # LaunchAgent doet dit al vóór elke run (orkestreer.ts:1467-1482), maar dat is
  # pas om 04:00; een release overdag laat de bin anders achterlopen tot die nacht.
  # Upgrade-only: een al even nieuwe (of nieuwere) versie wordt niet overschreven.
  # Soft-fail: de tag is het primaire release-artefact; een mislukte install is een
  # waarschuwing, geen harde fout — de nacht pikt het op.
  #
  # Draait op de mini (self-hosted runner): de globale bin staat daar. Geen
  # setup-node nodig: Node 22 via nvm is al beschikbaar, net als bij het nacht-script.
  #
  # Bewust niet door een test gedekt: pure YAML/shell zonder eigen poort, consistent
  # met de melding-job hieronder (release.yml, zie #195). Het bewijs dat de job werkt
  # is een echte release.
  globale-bin:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: [self-hosted, mini]
    steps:
      - name: Globale factory-bin verversen
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          versie="${TAG#v}"
          # Upgrade-only: lees de globale versie, vergelijk per component.
          # Zelfde semantiek als minstensVersie (integreer.ts:339) en het
          # nacht-script (orkestreer.ts:1472), maar in shell.
          globaal=$(node -e "
            try {
              const r = require('child_process')
                .execSync('npm root -g', { encoding: 'utf8' }).trim();
              const v = JSON.parse(require('fs')
                .readFileSync(r + '/@gjvv13/factory/package.json', 'utf8')).version;
              console.log(v);
            } catch {}
          " 2>/dev/null || true)
          if [ -n "$globaal" ]; then
            # Exit 0 = globaal >= versie (overslaan), exit 1 = installeren.
            if node -e "
              const a=process.argv[1].split('.').map(Number);
              const b=process.argv[2].split('.').map(Number);
              for(let i=0;i<3;i++){
                if((a[i]||0)>(b[i]||0))process.exit(0);
                if((a[i]||0)<(b[i]||0))process.exit(1);
              }
            " "$globaal" "$versie" 2>/dev/null; then
              echo "factory $globaal staat al globaal (>= $versie); install overgeslagen."
              exit 0
            fi
          fi
          # Registry-install i.p.v. git-install (#707/#714): een git-install van deze
          # pnpm-repo crasht in npm's git-dep-preparatie (`edgesOut`), en de oude
          # git-install faalde hier bovendien stil op EEXIST. De npm-tarball draagt de
          # gebouwde dist (het `files`-veld), dus geen prepare bij de install en geen
          # build-poort. Vereist dat de release naar npm is gepubliceerd (zie de
          # publish-stap in de release-job); is die versie er nog niet, dan waarschuwt npm.
          if npm install -g "@gjvv13/factory@$versie"; then
            echo "factory bijgewerkt naar $versie"
          else
            echo "::warning::kon de globale factory niet bijwerken naar $versie uit de registry; staat @gjvv13/factory@$versie al op npm? De nacht pikt het anders op."
          fi
      # De LaunchAgent-plists herladen zodat een code-fix aan bouwNachtScript de
      # daadwerkelijk draaiende nacht bereikt zonder handwerk (#632). Soft-fail:
      # een mislukte herlaadpoging is een waarschuwing, geen rode release — de
      # nacht pikt de nieuwe binary sowieso op via de zelf-update in het script.
      - name: LaunchAgent-plists herladen
        run: |
          factory orkestreer --herlaad-plists \
            || echo "::warning::kon de LaunchAgent-plists niet herladen; de nacht pikt de nieuwe bin op via de zelf-update."

  # Vangnet tegen een stílle overslag (#195): kon de release het board niet bijwerken, dan
  # hoort dat te staan waar ik toch al kijk — de ops-room — en niet alleen als een groene
  # regel in een log. Precies dat liet de kolom Uitrollen zes items diep vollopen.
  #
  # "Niet bijwerken" is breder dan een ontbrekend token: op v1.15.15 was het token er wél,
  # maar zonder de scope `project` — dan vindt de opzoeking het board niet en bleef het net
  # zo stil. Elke mislukte beweging telt daarom mee, niet alleen het ontbrekende secret.
  #
  # Draait op de mini, niet op de release-runner: het meld-endpoint van de assistent
  # luistert op loopback en een GitHub-hosted runner komt daar niet bij. Nodig zijn de
  # repo-variabele `DEPLOY_NOTIFY_URL` en het secret `DEPLOY_NOTIFY_TOKEN` (zoals
  # `deploy.yml` in de apps); zonder die variabele blijft het bij een waarschuwing.
  #
  # Bewust niet door een test gedekt: deze job is YAML zonder eigen poort, en een
  # nagebouwde curl zou alleen zichzelf toetsen. Wat wél te toetsen is — welke items
  # bleven liggen en dat ze als uitvoer de deur uit gaan — staat in `test/afronden.test.ts`.
  # Het bewijs dat de job zelf loopt is een echte release (acceptatiecriterium van #195).
  melding:
    needs: release
    if: ${{ needs.release.outputs.bord_overgeslagen != '' }}
    runs-on: [self-hosted, mini]
    steps:
      - name: Melden wat er niet gelukt is
        env:
          NOTIFY_URL: ${{ vars.DEPLOY_NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
          OVERGESLAGEN: ${{ needs.release.outputs.bord_overgeslagen }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bericht="⚠ factory-release $TAG:"
          if [ -n "$OVERGESLAGEN" ]; then
            bericht="$bericht het board is niet bijgewerkt (niet naar Done gezet: $OVERGESLAGEN; kijk eerst naar PROJECT_TOKEN — classic PAT, scope project)."
          fi
          bericht="$bericht Run: $run_url"
          if [ -z "$NOTIFY_URL" ]; then
            echo "::warning::$bericht — geen melding verstuurd (DEPLOY_NOTIFY_URL niet gezet)."
            exit 0
          fi
          curl -fsS -m 10 -X POST "$NOTIFY_URL" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"tekst\":\"$bericht\"}" \
            || echo "::warning::kon de melding over het board niet aan de assistent versturen."

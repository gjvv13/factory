name: dependabot-auto-merge

# Bewust een hand-onderhouden variant van de app-template
# `workflows/dependabot-auto-merge.yml`. De factory synct zichzelf niet
# (geen factory.json); wijzig je de template, werk dan dit bestand met de
# hand bij. Bump-plekken: dependabot/fetch-metadata.

# pull_request_target draait in de context van de base-branch en krijgt
# een GITHUB_TOKEN mét schrijfrechten — ook voor Dependabot-PR's, die op
# pull_request normaal een read-only token krijgen. Geen PAT nodig.
#
# Prerequisite (eenmalig, per repo):
# - "Allow auto-merge" aanzetten in de repository-instellingen.
# - Branch protection of ruleset met verplichte `verify`-check (zodat
#   --auto pas merget na groene CI).

on:
  pull_request_target:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # Leest het update-type uit de PR-metadata — geen checkout van
      # PR-code, dus veilig tegen supply-chain-aanvallen.
      - name: Dependabot-metadata ophalen
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge voor patch en minor
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
